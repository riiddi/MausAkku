name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: EXE bauen (eigenständig, keine .NET-Installation nötig)
        run: >
          dotnet publish MausAkku.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: MausAkku
          path: out/MausAkku.exe

      - name: Release anlegen (nur bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MausAkku.exe
